name: Publish

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      commit:
        type: string
        required: true
      artifact:
        type: string
        required: true
      prerelease:
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact }}
          path: release-assets/
      - name: Publish verified packages
        id: publish
        working-directory: release-assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          COMMIT: ${{ inputs.commit }}
          PRERELEASE: ${{ inputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check SHA256SUMS
          jq -e --arg tag "$TAG" --arg commit "$COMMIT" --argjson nightly "$PRERELEASE" '
            .tag == $tag and .commit == $commit and .dirty == false and
            ((.channel // "stable") == (if $nightly then "nightly" else "stable" end))
          ' release.json > /dev/null

          releases=$(gh api "repos/$GH_REPO/releases?per_page=100" --paginate --slurp)
          draft=$(jq -r --arg tag "$TAG" '.[][] | select(.tag_name == $tag) | .draft' <<< "$releases")
          if [[ -n "$draft" && "$draft" != true ]]; then
            echo "Release $TAG is already published or has an invalid draft state." >&2
            exit 1
          fi

          refs=$(gh api "repos/$GH_REPO/git/matching-refs/tags/$TAG")
          tag_exists=$(jq -r --arg ref "refs/tags/$TAG" 'any(.[]; .ref == $ref)' <<< "$refs")
          if [[ "$tag_exists" == false ]]; then
            [[ "$PRERELEASE" == true ]] || exit 1
            gh api "repos/$GH_REPO/git/refs" --method POST \
              -f "ref=refs/tags/$TAG" -f "sha=$COMMIT" > /dev/null
          fi
          [[ "$(gh api "repos/$GH_REPO/commits/$TAG" --jq '.sha')" == "$COMMIT" ]] || exit 1

          latest=true
          if [[ "$PRERELEASE" == true ]]; then latest=false; fi
          if [[ -z "$draft" ]]; then
            gh release create "$TAG" --verify-tag --draft --title "$TAG" \
              --prerelease="$PRERELEASE" --latest="$latest" \
              --generate-notes --notes-file RELEASE_NOTES.md
          fi
          gh release upload "$TAG" ./*.zip release.json SHA256SUMS --clobber
          [[ "$(gh api "repos/$GH_REPO/commits/$TAG" --jq '.sha')" == "$COMMIT" ]] || exit 1
          gh release edit "$TAG" --draft=false --prerelease="$PRERELEASE" --latest="$latest"
