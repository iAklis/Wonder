name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing stable version tag, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: read

# Never cancel an in-progress upload/publication for the same tag.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/check.yml
    with:
      release_tag: ${{ inputs.tag || github.ref_name }}
    permissions:
      contents: read

  publish:
    needs: verify
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ needs.verify.outputs.tag }}
      commit: ${{ needs.verify.outputs.commit }}
      artifact: ${{ needs.verify.outputs.artifact }}
    permissions:
      contents: write
