name: Nightly

on:
  schedule:
    # 08:23 Asia/Shanghai, away from the hourly scheduling peak.
    - cron: "23 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Serialize the gate and publication together, including manual runs.
concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  changes:
    name: Check for an unpublished main-branch commit
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      build: ${{ steps.check.outputs.build }}
      commit: ${{ steps.check.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Compare branch HEAD with published nightlies
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NIGHTLY_BRANCH: ${{ github.event.repository.default_branch }}
        run: node scripts/nightly-release.mjs

  verify:
    needs: changes
    if: ${{ needs.changes.outputs.build == 'true' }}
    uses: ./.github/workflows/check.yml
    with:
      source_ref: ${{ needs.changes.outputs.commit }}
      release_channel: nightly
    permissions:
      contents: read

  publish:
    name: Publish nightly prerelease
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.verify.outputs.artifact }}
          path: release-assets/
      - name: Verify uploaded files and publish nightly
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.verify.outputs.commit }}
          RELEASE_CHANNEL: nightly
        run: node scripts/publish-release.mjs
