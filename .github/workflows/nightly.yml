name: Nightly

on:
  schedule:
    # 08:23 Asia/Shanghai.
    - cron: "23 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  changes:
    name: Check for a new nightly
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      build: ${{ steps.check.outputs.build }}
      commit: ${{ steps.check.outputs.commit }}
    steps:
      - name: Check published nightlies
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          commit=$(gh api "repos/$GH_REPO/git/ref/heads/$BRANCH" --jq '.object.sha')
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]] || exit 1
          tag="nightly-$commit"
          releases=$(gh api "repos/$GH_REPO/releases?per_page=100" --paginate --slurp)
          build=true
          published=$(jq -r --arg tag "$tag" 'any(.[][]; .tag_name == $tag and .draft == false and .prerelease == true)' <<< "$releases")
          if [[ "$published" == true ]]; then
            [[ "$(gh api "repos/$GH_REPO/commits/$tag" --jq '.sha')" == "$commit" ]] || exit 1
            build=false
          fi
          printf 'commit=%s\nbuild=%s\n' "$commit" "$build" >> "$GITHUB_OUTPUT"
          printf 'Nightly commit: %s; build required: %s\n' "$commit" "$build" >> "$GITHUB_STEP_SUMMARY"

  verify:
    needs: changes
    if: ${{ needs.changes.outputs.build == 'true' }}
    uses: ./.github/workflows/check.yml
    with:
      source_ref: ${{ needs.changes.outputs.commit }}
      release_channel: nightly
    permissions:
      contents: read

  publish:
    needs: verify
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ needs.verify.outputs.tag }}
      commit: ${{ needs.verify.outputs.commit }}
      artifact: ${{ needs.verify.outputs.artifact }}
      prerelease: true
    permissions:
      contents: write
